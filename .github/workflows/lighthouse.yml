name: Lighthouse

# Quality audit of key public pages. Runs independently of the deploy
# pipeline so a flaky perf run never blocks a release. Accessibility and SEO
# are hard gates; performance and best-practices are warnings.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADSLzp6yl8WQnFBT"

      - name: Start preview server
        run: |
          bunx wrangler pages dev dist --port 8788 --local --ip 127.0.0.1 > wrangler.log 2>&1 &
          echo "WRANGLER_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8788/ > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time. Logs:"
          cat wrangler.log
          exit 1

      - name: Run Lighthouse CI
        run: bunx @lhci/cli@0.14.x autorun

      - name: Stop preview server
        if: always()
        run: kill "$WRANGLER_PID" || true
